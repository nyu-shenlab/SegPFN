[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "segpfn"
version = "0.1.0"
description = "Reference-conditioned binary image segmentation with DINOv3-L and TabPFN"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["licenses/*.txt"]
dependencies = [
    "torch==2.13.0", "torchvision==0.28.0", "transformers==5.17.0", "tabpfn==9.1.0",
    "numpy==2.5.3", "scipy==1.18.1", "scikit-learn==1.9.1", "Pillow==12.3.0",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
segpfn = "segpfn.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
segpfn = ["assets/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
